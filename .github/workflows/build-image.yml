name: Build and Push Image

on:
  push:
    branches:
      - version-1

permissions:
  contents: read
  packages: write

jobs:
  build:
    if: github.ref_name == 'version-1'
    runs-on: ubuntu-latest
    env:
      REGISTRY: ghcr.io

    steps:
      - name: Checkout app repo
        uses: actions/checkout@v4

      - name: Set lowercase image name
        shell: bash
        run: |
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Read app version
        id: version
        shell: bash
        run: |
          APP_VERSION="$(python - <<'PY'
          import ast
          from pathlib import Path

          tree = ast.parse(Path("time_tracking/__init__.py").read_text(encoding="utf-8"))
          for node in tree.body:
            if isinstance(node, ast.Assign):
              for target in node.targets:
                if isinstance(target, ast.Name) and target.id == "__version__":
                  value = node.value
                  if isinstance(value, ast.Constant) and isinstance(value.value, str):
                    print(value.value)
                    raise SystemExit(0)
          raise SystemExit("Could not read __version__ from time_tracking/__init__.py")
          PY
          )"

          # On release branch version-1 we require stable SemVer (no -dev/-rc suffixes).
          if [[ ! "$APP_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release version in time_tracking/__init__.py: '$APP_VERSION'"
            echo "Expected stable SemVer format: X.Y.Z (example: 1.0.0)"
            exit 1
          fi

          echo "app_version=$APP_VERSION" >> "$GITHUB_OUTPUT"
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"
          echo "Using image tags: latest and $APP_VERSION"

      - name: Checkout frappe_docker
        uses: actions/checkout@v4
        with:
          repository: frappe/frappe_docker
          path: frappe_docker

      - name: Prepare apps.json (base64)
        id: prep
        shell: bash
        run: |
          cat > apps.json <<EOF
          [
            {
              "url": "https://github.com/${{ github.repository }}",
              "branch": "version-1"
            }
          ]
          EOF

          APPS_JSON_BASE64="$(base64 -w 0 apps.json 2>/dev/null || base64 apps.json)"
          echo "APPS_JSON_BASE64=$APPS_JSON_BASE64" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Ensure version tag does not already exist
        shell: bash
        run: |
          if docker manifest inspect "${{ env.IMAGE }}:${{ steps.version.outputs.app_version }}" >/dev/null 2>&1; then
            echo "Image tag already exists: ${{ env.IMAGE }}:${{ steps.version.outputs.app_version }}"
            echo "Bump time_tracking/__init__.py (__version__) before pushing to version-1."
            exit 1
          fi

      - name: Build image
        run: |
          docker build \
            --build-arg=FRAPPE_PATH=https://github.com/frappe/frappe \
            --build-arg=FRAPPE_BRANCH=version-16 \
            --build-arg=APPS_JSON_BASE64=${{ steps.prep.outputs.APPS_JSON_BASE64 }} \
            --tag ${{ env.IMAGE }}:latest \
            --tag ${{ env.IMAGE }}:${{ steps.version.outputs.app_version }} \
            --file frappe_docker/images/layered/Containerfile \
            frappe_docker

      - name: Push image
        run: |
          docker push ${{ env.IMAGE }}:latest
          docker push ${{ env.IMAGE }}:${{ steps.version.outputs.app_version }}
