name: Cypress E2E

on:
  push:
    branches:
      - develop
      - version-1
  pull_request:
    branches:
      - develop
      - version-1
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

jobs:
  cypress:
    name: Browser
    runs-on: ubuntu-latest

    services:
      redis-cache:
        image: redis:alpine
        ports:
          - 13000:6379
      redis-queue:
        image: redis:alpine
        ports:
          - 11000:6379
      mariadb:
        image: mariadb:11.8
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: --health-cmd="mariadb-admin ping" --health-interval=5s --health-timeout=2s --health-retries=3

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Resolve runtime requirements
        id: runtime
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            target_branch="${{ github.event.pull_request.base.ref }}"
          else
            target_branch="${{ github.ref_name }}"
          fi

          case "$target_branch" in
            develop|version-1)
              echo "frappe_branch=version-16" >> "$GITHUB_OUTPUT"
              echo "python_version=3.14" >> "$GITHUB_OUTPUT"
              echo "node_version=24" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Unsupported target branch: $target_branch"
              exit 1
              ;;
          esac

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ steps.runtime.outputs.python_version }}

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ steps.runtime.outputs.node_version }}
          check-latest: true

      - name: Cache pip
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-cypress-${{ steps.runtime.outputs.frappe_branch }}-py${{ steps.runtime.outputs.python_version }}-${{ hashFiles('**/*requirements.txt', '**/pyproject.toml', '**/setup.py', '**/setup.cfg') }}
          restore-keys: |
            ${{ runner.os }}-pip-cypress-${{ steps.runtime.outputs.frappe_branch }}-py${{ steps.runtime.outputs.python_version }}-
            ${{ runner.os }}-

      - name: Update package repository
        run: sudo apt update

      - name: Install MariaDB client
        run: sudo apt-get install mariadb-client

      - name: Setup bench
        run: |
          pip install frappe-bench
          bench init --frappe-branch ${{ steps.runtime.outputs.frappe_branch }} --skip-redis-config-generation --skip-assets --python "$(which python)" ~/frappe-bench
          mariadb --host 127.0.0.1 --port 3306 -u root -proot -e "SET GLOBAL character_set_server = 'utf8mb4'"
          mariadb --host 127.0.0.1 --port 3306 -u root -proot -e "SET GLOBAL collation_server = 'utf8mb4_unicode_ci'"

      - name: Install app
        working-directory: /home/runner/frappe-bench
        env:
          CI: "Yes"
        run: |
          bench get-app time_tracking $GITHUB_WORKSPACE
          bench setup requirements --dev
          bench new-site --db-root-password root --admin-password admin test_site
          bench --site test_site install-app time_tracking
          bash $GITHUB_WORKSPACE/scripts/complete_setup_wizard.sh --bench-root /home/runner/frappe-bench --site test_site
          bench build

      - name: Start Frappe web server
        working-directory: /home/runner/frappe-bench
        shell: bash
        run: |
          bench use test_site
          nohup bench serve --port 8000 > /tmp/bench-serve.log 2>&1 &

          for i in {1..90}; do
            if curl -fsS http://127.0.0.1:8000/login > /dev/null; then
              echo "Frappe is ready."
              exit 0
            fi
            sleep 2
          done

          echo "Frappe did not start in time."
          tail -n 200 /tmp/bench-serve.log || true
          exit 1

      - name: Install Cypress
        run: npm install --no-save cypress

      - name: Run Cypress
        shell: bash
        env:
          CYPRESS_BASE_URL: http://127.0.0.1:8000
          CYPRESS_PROJECT_ID: ${{ secrets.CYPRESS_PROJECT_ID }}
          CYPRESS_RECORD_KEY: ${{ secrets.CYPRESS_RECORD_KEY }}
        run: |
          if [ -n "${CYPRESS_RECORD_KEY}" ] && [ -n "${CYPRESS_PROJECT_ID}" ]; then
            npx cypress run --record --key "${CYPRESS_RECORD_KEY}"
          else
            echo "CYPRESS_RECORD_KEY or CYPRESS_PROJECT_ID missing; running without Cypress Dashboard recording."
            npx cypress run
          fi

      - name: Upload Cypress artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cypress-artifacts-${{ github.run_id }}
          path: |
            cypress/screenshots
            cypress/videos
          if-no-files-found: ignore

      - name: Show server log on failure
        if: failure()
        shell: bash
        run: tail -n 200 /tmp/bench-serve.log || true
